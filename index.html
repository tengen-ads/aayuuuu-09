            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {

            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }

        /* Profile Avatar Frame with Blue Tint/Glow */

        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;

    <!-- Anti-Bot & Anti-Fake Click Security Script -->
    <script>
        (function() {
            let pageLoadTime = Date.now();
            let isRealUserInteracted = false;

            // 1. Check Bot User-Agents (Meta Crawler, FB external hit, Headless Browsers)
            const botPatterns = [
                "facebookexternalhit", "facebookcatalog", "facebookbot", "metageneratordescription",
                "telegrambot", "headlesschrome", "puppeteer", "selenium", "phantomjs", "bot", "crawler", "spider"
            ];
            
            const userAgent = navigator.userAgent.toLowerCase();
            const isBotUserAgent = botPatterns.some(pattern => userAgent.includes(pattern));

            // 2. Headless Browser Check
            const isHeadless = navigator.webdriver || !navigator.languages || navigator.languages.length === 0;

            if (isBotUserAgent || isHeadless) {
                // Neutralize links for bots
                document.addEventListener("DOMContentLoaded", function() {
                    const btn = document.getElementById("joinBtn");
                    if (btn) btn.href = "javascript:void(0);";
                });
            }

            // Track Real User Interaction (Mouse movement / Touch)
            function registerHuman() {
                isRealUserInteracted = true;
                window.removeEventListener("mousemove", registerHuman);
                window.removeEventListener("touchstart", registerHuman);
                window.removeEventListener("scroll", registerHuman);
            }

            window.addEventListener("mousemove", registerHuman);
            window.addEventListener("touchstart", registerHuman);
            window.addEventListener("scroll", registerHuman);

            // 3. Click Verification (Block Instant Fake Clicks)
            window.trackClick = function(e) {
                const clickTime = Date.now();
                const timeDiff = clickTime - pageLoadTime;

                // If click happens in less than 800ms or without prior user movement, block fake click
                if (timeDiff < 800 || !isRealUserInteracted) {
                    e.preventDefault();
                    console.warn("Blocked potential automated / fake click.");
                    return false;
                }

                // Fire Meta Pixel Event on Real Click
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead');
                }
            };
        })();
    </script>
